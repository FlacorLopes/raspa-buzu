# Local Redis + Upstash-compatible REST proxy, so `vercel dev` works without the cloud store.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  srh:
    image: hiett/serverless-redis-http:latest
    ports: ["8079:80"]
    environment:
      SRH_MODE: env
      SRH_TOKEN: dev-token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on: [redis]
